# Python lint and format settings. See https://docs.astral.sh/ruff/.

# The runtime minimum from docs/layout.md.
target-version = "py311"
# First-party import roots: scripts import the shared package from
# scripts/opentlv_workspace/, and tests import the tests package from the
# repository root.
src = [".", "scripts"]

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # import sorting
  "B",   # common bug patterns
  "UP",  # syntax for the target Python version
]
