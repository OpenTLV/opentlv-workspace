name: Workspace Full
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: workspace-full-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  lock:
    name: Lock combination
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          python -B scripts/integration.py fast
          python -B scripts/quality.py lock --request build/request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-lock-${{ github.run_attempt }}
          path: build/request.json
          if-no-files-found: error
  integration:
    name: Integration (${{ matrix.mode }})
    needs: [lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [sibling, remote]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: false
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lua5.4 liblua5.4-dev
          python -m pip install -r requirements-integration.txt
          # The pinned stable toolchain of opentlv-rust's CI matrix.
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Build and smoke-test pinned combination
        env:
          MODE: ${{ matrix.mode }}
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: >-
          python -B scripts/integration.py full --mode "$MODE"
          --work-dir "build/$MODE" --report "build/results/$MODE.json"
          --lua lua5.4 --lua-include /usr/include/lua5.4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-integration-${{ matrix.mode }}-${{ github.run_attempt }}
          path: build/results/${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 14
  gate:
    name: Workspace full gate
    if: always()
    needs: [lock, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all scenarios
        env:
          LOCK: ${{ needs.lock.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "$LOCK" = success
          test "$INTEGRATION" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: always()
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this attempt's evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh run download "$RUN" --name "workspace-lock-$ATTEMPT" --dir build/lock
          gh run download "$RUN" --name "workspace-integration-sibling-$ATTEMPT" --dir build/reports
          gh run download "$RUN" --name "workspace-integration-remote-$ATTEMPT" --dir build/reports
      - name: Verify source and attempt identities
        run: >-
          python -B scripts/quality.py verify --request build/lock/request.json
          --reports build/reports --output build/evidence/integration-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-full-evidence-${{ github.run_attempt }}
          path: build/evidence/integration-evidence.json
          if-no-files-found: error
      - name: Record Full job timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ github.workflow == 'Workspace Release' && 'Full / ' || '' }}
        run: >-
          python -B scripts/ci_timings.py --current
          --job "${PREFIX}Lock combination" --job "${PREFIX}Integration (sibling)"
          --job "${PREFIX}Integration (remote)" --output build/timings/full.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-full-timings-${{ github.run_attempt }}
          path: build/timings/full.json
          if-no-files-found: error
