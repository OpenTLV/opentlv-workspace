name: Workspace CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      full: ${{ steps.selection.outputs.full }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install contributor dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Cache pinned pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-python311-${{ hashFiles('.pre-commit-config.yaml', 'requirements-dev.txt') }}
      - name: Validate hook configuration
        run: python -m pre_commit validate-config
      - name: Validate workspace integration contracts
        run: |
          python -B scripts/integration.py fast
          python -B -m unittest discover -s tests -p test_integration.py -v
      - name: Run pre-commit checks
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Select required integration checks
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python -B scripts/integration.py plan --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python -B scripts/integration.py plan
          fi

  bootstrap:
    name: Fast bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify Git is available
        run: git --version
      - name: Run offline bootstrap tests
        run: python -B tests/test_bootstrap.py -v

  full:
    name: Full CI (${{ matrix.mode }})
    needs: [fast, bootstrap]
    if: needs.fast.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [sibling, remote]
    steps:
      - name: Check out workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - name: Install smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lua5.4 liblua5.4-dev
          python -m pip install -r requirements-integration.txt
      - name: Build and smoke-test the selected repository combination
        env:
          MODE: ${{ matrix.mode }}
        run: >-
          python -B scripts/integration.py full
          --mode "$MODE" --work-dir "build/$MODE"
          --report "build/results/$MODE.json" --lua lua5.4
          --lua-include /usr/include/lua5.4
      - name: Upload integration provenance and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-integration-${{ matrix.mode }}
          path: build/results/*.json
          if-no-files-found: error
          retention-days: 14

  integration-gate:
    name: Workspace integration gate
    if: always()
    needs: [fast, bootstrap, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          FAST: ${{ needs.fast.result }}
          BOOTSTRAP: ${{ needs.bootstrap.result }}
          FULL_REQUIRED: ${{ needs.fast.outputs.full }}
          FULL: ${{ needs.full.result }}
        run: |
          test "$FAST" = success
          test "$BOOTSTRAP" = success
          case "$FULL_REQUIRED:$FULL" in
            true:success|false:skipped) ;;
            *) echo "Required integration checks did not pass"; exit 1 ;;
          esac
