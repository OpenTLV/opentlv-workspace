# Licensing metadata for files that cannot carry their own SPDX header. List
# each file by its exact path. Do not add glob patterns: a file that is not
# listed here and has no header must fail the REUSE check. See
# docs/licensing.md.
version = 1

[[annotations]]
path = [
  # JSON, which has no comment syntax.
  ".pymarkdown",
  # Generated by uv. Regeneration replaces the whole file.
  "requirements-dev.txt",
  "requirements-lock.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Marek Cingel"
SPDX-License-Identifier = "MIT"
