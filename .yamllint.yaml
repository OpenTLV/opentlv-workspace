# YAML lint settings. See https://yamllint.readthedocs.io.
extends: default

rules:
  # Configuration files here are single documents without a "---" marker.
  document-start: disable
  line-length:
    max: 120
  # GitHub Actions uses "on" as a mapping key.
  truthy:
    check-keys: false
