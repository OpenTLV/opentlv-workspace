# Third-party and generated files retain their own notices and formatting.
exclude: (^|/)(vendor|third_party|generated)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: '(?i:\.(bin|dat)$)|^tests/fixtures/binary/'
      - id: end-of-file-fixer
        types: [text]
        exclude: '(?i:\.(bin|dat)$)|^tests/fixtures/binary/'
      - id: check-yaml
      - id: check-json
        exclude: '\.code-workspace$'
      - id: check-ast
      - id: check-added-large-files
        args: [--enforce-all]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        types: [markdown, text]
        args: [--fix, --config, .markdownlint.json]

  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
