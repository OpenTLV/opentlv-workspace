# Third-party and generated files retain their own notices and formatting.
exclude: (^|/)(vendor|third_party|generated)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: '(?i:\.(bin|dat)$)|^tests/fixtures/binary/'
      - id: end-of-file-fixer
        types: [text]
        exclude: '(?i:\.(bin|dat)$)|^tests/fixtures/binary/'
      - id: check-yaml
      - id: check-json
        exclude: '\.code-workspace$'
      - id: check-ast
      - id: check-added-large-files
        args: [--enforce-all]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        types: [markdown, text]
        args: [--fix, --config, .markdownlint.json]

  - repo: local
    hooks:
      - id: reuse-annotate
        name: Add source license headers
        entry: reuse annotate
        language: python
        additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
        args:
          - --copyright
          - Marek Cingel
          - --year
          - '2026'
          - --license
          - MIT
          - --copyright-prefix
          - string-c
          - --template
          - source-header
        files: '^(scripts|tests)/.*\.pyi?$'
        types: [text]
        exclude: ^tests/fixtures/binary/

  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
