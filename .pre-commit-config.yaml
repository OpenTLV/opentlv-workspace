# Contributor quality checks. Every hook runs a tool from the hash-locked
# requirements-dev.txt in the activated virtual environment, so hooks need
# no network access and install nothing. See docs/tooling.md.
minimum_pre_commit_version: 4.7.0

repos:
  - repo: local
    hooks:
      # Repository hygiene
      - id: check-added-large-files
        name: Check file size (1 MiB limit)
        entry: check-added-large-files --enforce-all --maxkb=1024
        language: system
      - id: check-case-conflict
        name: Check for case-insensitive path conflicts
        entry: check-case-conflict
        language: system
      - id: check-merge-conflict
        name: Check for merge conflict markers
        entry: check-merge-conflict --assume-in-merge
        language: system
        types: [text]
      - id: check-symlinks
        name: Check for broken symbolic links
        entry: check-symlinks
        language: system
        types: [symlink]
      - id: detect-private-key
        name: Check for private keys
        entry: detect-private-key
        language: system
        types: [text]

      # Whitespace and line endings, matching .editorconfig
      - id: fix-byte-order-marker
        name: Remove UTF-8 byte order marks
        entry: fix-byte-order-marker
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: \.(diff|patch)$
      - id: end-of-file-fixer
        name: End files with a single newline
        entry: end-of-file-fixer
        language: system
        types: [text]
      - id: mixed-line-ending
        name: Check for mixed line endings
        entry: mixed-line-ending --fix=no
        language: system
        types: [text]

      # Structured data
      - id: check-json
        name: Check JSON syntax
        entry: check-json
        language: system
        files: (\.json|^\.pymarkdown|^opentlv\.code-workspace)$
      - id: check-toml
        name: Check TOML syntax
        entry: check-toml
        language: system
        types: [toml]
      - id: yamllint
        name: Lint YAML
        entry: yamllint --strict
        language: system
        types: [yaml]

      # Markdown
      - id: pymarkdown
        name: Lint Markdown
        entry: pymarkdown scan
        language: system
        types: [markdown]

      # Python
      - id: ruff-check
        name: Lint Python
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Format Python
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      # Workspace checks. They run the workspace's own standard-library code
      # with the Python of the active environment and work offline.
      - id: check-inventory
        name: Check repository inventory and editor workspace
        entry: python scripts/check_inventory.py
        language: system
        pass_filenames: false
        files: ^(repositories\.toml|opentlv\.code-workspace|scripts/.*\.py)$
      - id: unittest
        name: Run workspace tests
        entry: python -m unittest discover --start-directory tests --top-level-directory .
        language: system
        pass_filenames: false
        files: ^(repositories\.toml|opentlv\.code-workspace|(scripts|tests)/.*\.py)$

      # Licensing metadata. REUSE checks the whole repository, including
      # untracked files that Git does not ignore, so the hook ignores the
      # selected file names and runs on every commit.
      - id: reuse
        name: Check REUSE licensing metadata
        entry: reuse lint
        language: system
        pass_filenames: false
        always_run: true
